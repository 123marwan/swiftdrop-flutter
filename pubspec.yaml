name: swiftdrop_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  # Cupertino Icons
  cupertino_icons: ^1.0.8

  # State Management (لإدارة الحالة باحترافية)
  flutter_bloc: ^8.1.3

  # Network & API & WebSockets (للاتصال بالباك اند والـ WebSockets)
  dio: ^5.4.0
  stomp_dart_client: ^2.0.0

  # Maps & Location (للخرائط وتحديد المواقع اللحظية)
  google_maps_flutter: ^2.5.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0

  # Dependency Injection & Storage (لإدارة الـ Instances والتخزين المحلي)
  get_it: ^7.6.7
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true